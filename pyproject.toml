[build-system]
build-backend = "hatchling.build"
requires = ["hatchling >=1.12.2"]

[project]
dependencies = [
  "anaconda-anon-usage",
  "conda-otel",
  "opentelemetry-exporter-otlp-proto-http",
  "requests",
]
description = "Anaconda provider for conda-otel"
license = { file = "LICENSE" }
name = "conda-otel-anaconda"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/lrandersson/conda-otel-anaconda"

[project.entry-points.conda]
conda-otel-anaconda = "conda_otel_anaconda.hooks"

[tool.hatch.version]
path = "conda_otel_anaconda/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["conda_otel_anaconda"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
show-fixes = true

[tool.ruff.lint]
flake8-type-checking = { exempt-modules = [], strict = true }
# see https://docs.astral.sh/ruff/rules/
select = [
  "B012",  # bugbear
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "FA",  # flake8-future-annotations
  "G",  # flake8-logging-format
  "I",  # isort
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "RUF100",  # Unused noqa directive
  "T10",  # flake8-debugger
  "TC",  # flake8-type-checking
  "UP",  # pyupgrade
  "W",  # pycodestyle warnings
]
